<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Station Live: All-in-One Internet Radio Platform</title>
    <!-- Use static Tailwind build to avoid CSP eval issues -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
      :root {
        --primary-50: #eff6ff;
        --primary-100: #dbeafe;
        --primary-200: #bfdbfe;
        --primary-300: #93c5fd;
        --primary-400: #60a5fa;
        --primary-500: #3b82f6;
        --primary-600: #2563eb;
        --primary-700: #1d4ed8;
        --primary-800: #1e40af;
        --primary-900: #1e3a8a;
        --primary-950: #172554;
      }

      /* Custom background and text colors to match the app's theme */
      .bg-primary-600 { background-color: var(--primary-600); }
      .hover\:bg-primary-700:hover { background-color: var(--primary-700); }
      .text-primary-400 { color: var(--primary-400); }
      .text-primary-500 { color: var(--primary-500); }
      .border-primary-500 { border-color: var(--primary-500); }
      .bg-primary-900\/50 { background-color: rgba(30, 58, 138, 0.5); }
      .bg-primary-600\/20 { background-color: rgba(37, 99, 235, 0.2); }

      html {
        scroll-behavior: smooth;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #111827; /* gray-900 */
        color: #e5e7eb; /* gray-200 */
      }

      @keyframes background-pan {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes fade-in-up {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-background-pan {
        animation: background-pan 10s ease-in-out infinite;
      }

      .animate-fade-in-up {
        animation: fade-in-up 0.8s ease-out forwards;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
  </head>
  <body class="bg-gray-900 text-gray-200">
    <div id="root"></div>
  </body>
</html>
